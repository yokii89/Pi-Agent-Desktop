# PiDesk Windows 打包分发：tag 推送 → 构建 NSIS 安装包 → 发 GitHub Release。
#
# 分发链路只有 GitHub Actions + GitHub Releases 两层，不引入第三方发布 Action：
# - 推送 `v*` tag（如 v0.2.0）触发构建，产物直接挂到对应 Release；
#   workflow_dispatch 支持手动触发一次「只出构建工件、不发 Release」的试打包。
# - 构建命令与本地完全一致（pnpm dist，见 scripts/package.mjs），
#   其中已显式 --publish=never，electron-builder 不会自己碰 Releases，发布统一由最后的 gh 步骤完成。
#
# 已知取舍：产物不做代码签名，用户首次运行会遇到 SmartScreen / 杀软提示
# （「更多信息 → 仍要运行」可过）。要消除提示需要购买代码签名证书并在构建步骤接入，
# 接入时在 pnpm dist 前补签名步骤，electron-builder.yml 再加 win.certificateSubjectName 等配置。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  # gh release create 需要对 Releases 的写权限
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    # Electron 发行包直连 github.com（~118MB 长传输）在 runner 出口网关上反复 504
    # （v0.5.4 重建连续两次在同一点失败，zip 到 100% 后网关超时）。改走 npmmirror 的
    # CDN——@electron/get / electron-builder 都认这个变量，zip 与 SHASUMS256 一并换源。
    # electron-builder 自家的 NSIS 辅助二进制同样从 github.com 拉、同样 504（第三次失败点），
    # 用对应镜像变量一并换源（7zip@1.0.0 来自 npm registry，不受影响）。
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
    steps:
      - uses: actions/checkout@v4

      # 版本读 package.json 的 packageManager 字段（pnpm@12.4.1），无需在此指定
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # electron-builder 打包时会从 github.com 拉 Electron 发行包与 NSIS / 7zip 等辅助二进制；
      # runner 每次冷缓存都要全量重下，网关偶发 504 会直接打断构建（v0.5.4 首次构建即因此失败）。
      # 缓存键取 package.json 的 Electron 版本（发版 bump 只改 lockfile，不能拿 lockfile 做键）；
      # restore-keys 前缀兜底，Electron 升级后仍可复用 NSIS 等不变的部分。
      - name: 读取 Electron 版本（缓存键）
        id: electron-version
        shell: bash
        run: echo "version=$(node -p 'require("./package.json").devDependencies.electron')" >> "$GITHUB_OUTPUT"

      - name: 缓存 Electron 与 electron-builder 二进制
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ci-binaries-electron-${{ steps.electron-version.outputs.version }}
          restore-keys: |
            ci-binaries-electron-

      - name: 安装依赖
        env:
          # electron 的 postinstall 会下载 Electron 发行包（~110MB），是 CI 网络抖动的重灾区；
          # 打包链路用的是 electron-builder 自己经 @electron/get 的下载（见上一步缓存覆盖），
          # 不读 node_modules/electron/dist，tsc / vite 构建同样不需要二进制——CI 直接跳过。
          # 代价：pnpm start / pnpm dev 在 CI 环境不可用，但发版流程没有这一步。
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile

      - name: 打包（NSIS 安装包）
        run: pnpm dist

      - name: 检查产物
        shell: bash
        run: |
          ls -lh release/
          test -f release/PiDesk-Setup-*.exe || { echo "缺少安装包产物"; exit 1; }
          test -f release/latest.yml || { echo "缺少 latest.yml（electron-updater 元数据）"; exit 1; }
          ls release/PiDesk-Setup-*.exe.blockmap >/dev/null || { echo "缺少 blockmap（差量更新）"; exit 1; }

      # 每次构建都上传工件，便于手动触发试打包时直接下载验收
      # latest.yml + blockmap 是 electron-updater 发现/差量更新的必需产物（docs/design/35）
      - name: 上传构建工件
        uses: actions/upload-artifact@v4
        with:
          name: PiDesk-windows-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/SHASUMS256.txt
          if-no-files-found: error

      # 仅 tag 构建发布 Release。正文来自仓库里的 release-notes/v<版本>.md
      # （双语：英文在前、简体中文在后，同 README 顺序），不再用 --generate-notes——
      # 本仓库直推 main、没有 PR，自动生成的正文只剩一行 Full Changelog 链接。
      # 缺文件就失败，而不是静默发一个没有说明的 Release。
      # 必须带上 latest.yml / blockmap，已装客户端的 electron-updater 才能发现并差量升级
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$notes" ]; then
            echo "缺少更新日志 $notes（空文件或不存在）。先在仓库里写好该文件、连同 release commit 一起推送，再重打 tag。"
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "PiDesk ${GITHUB_REF_NAME}" \
            --notes-file "$notes" \
            release/PiDesk-Setup-*.exe \
            release/PiDesk-Setup-*.exe.blockmap \
            release/latest.yml \
            release/SHASUMS256.txt
