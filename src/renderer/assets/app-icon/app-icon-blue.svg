<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <title>PiDesk</title>
  <!-- 深色背景 -->
  <rect width="300" height="300" fill="#121212" />
  
  <!-- 
    像素艺术图形 (使用 evenodd 填充规则处理镂空)
    基础网格为 4x4，每个“像素”块大小为 50x50。
    整体四周留有 50px 的边距 (Padding)。
  -->
  <path d="
    M 50,50 
    H 200 
    V 150 
    H 150 
    V 200 
    H 100 
    V 250 
    H 50 
    Z 
    
    M 100,100 
    H 150 
    V 150 
    H 100 
    Z 
    
    M 200,150 
    H 250 
    V 250 
    H 200 
    Z" 
    fill="#5BC0EB" 
    fill-rule="evenodd" 
  />
</svg>
